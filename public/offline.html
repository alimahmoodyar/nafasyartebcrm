<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#39429a"><title>هم‌نفس — اتصال برقرار نیست</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f6fb;color:#27345b;font:18px/2 Tahoma,sans-serif}main{max-width:480px;margin:24px;padding:28px;background:white;border-radius:24px;border:1px solid #dde3ef}h1{font-size:24px}a{display:inline-block;background:#39429a;color:white;padding:10px 22px;border-radius:12px;text-decoration:none}</style></head><body><!-- hamnafas-public-offline --><main><h1>هم‌نفس</h1><h2>اتصال به سامانه برقرار نیست</h2><p>اینترنت گوشی را بررسی کنید و دوباره تلاش کنید. برای مشاهده یا ثبت اطلاعات باید به سرور شرکت متصل باشید.</p><p>اگر هنگام ارسال فرم اتصال قطع شد، پس از اتصال نتیجه را در سوابق بررسی کنید؛ نمایش این صفحه به معنی ثبت موفق نیست.</p><a href="/">تلاش دوباره</a></main></body></html>
